# Optional: pings Supabase twice a week so the free-tier project doesn't pause
# from inactivity between your monthly entries. Needs two repo secrets:
# SUPABASE_URL and SUPABASE_ANON_KEY (same values as config.js). Skips if missing.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 14 * * 1,4" # Mon & Thu
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets not set; skipping."; exit 0
          fi
          curl -fsS "$SUPABASE_URL/rest/v1/months?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY"
